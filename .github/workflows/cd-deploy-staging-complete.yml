# =============================================================
# CD - Deploy to Staging (Complete Pipeline)
# =============================================================
# Triggered automatically after status-page-app CI/CD pushes
# a new image to ECR and sends a repository_dispatch event.
#
# Flow: status-page-app CI → repository_dispatch → this workflow
#       → deploy to staging namespace → run comprehensive tests
#       → report results back to status-page-app
# =============================================================

name: CD - Deploy to Staging (Complete)

on:
  repository_dispatch:
    types: [update-image]

  push:
    branches:
      - develop
    paths:
      - 'helm-statuspage/**'

  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom image tag to deploy (optional)'
        required: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: Nadav-Statuspage-EKS-DEV
  ECR_REPOSITORY: 992382545251.dkr.ecr.us-east-1.amazonaws.com/nadav-statuspage
  HELM_RELEASE_NAME: statuspage-staging
  HELM_NAMESPACE: staging

# ─────────────────────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────────────────────
jobs:

  # ===========================================================
  # Stage 1: Prepare
  # ===========================================================
  prepare:
    name: "Stage 1: Prepare"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      IMAGE_TAG: ${{ steps.set-tag.outputs.IMAGE_TAG }}
      TRIGGER_SOURCE: ${{ steps.set-tag.outputs.TRIGGER_SOURCE }}
      SOURCE_REPO: ${{ steps.set-tag.outputs.SOURCE_REPO }}
      DEPLOY_TIMESTAMP: ${{ steps.set-tag.outputs.DEPLOY_TIMESTAMP }}
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Extract image tag
        id: set-tag
        run: |
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "DEPLOY_TIMESTAMP=$TIMESTAMP" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            IMAGE_TAG="${{ github.event.client_payload.image_tag }}"
            TRIGGER_SOURCE="repository_dispatch"
            SOURCE_REPO="${{ github.event.client_payload.repository }}"
            echo "📦 Image tag from repository_dispatch: $IMAGE_TAG"
            echo "📌 Source repository: $SOURCE_REPO"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            if [ -z "$IMAGE_TAG" ]; then
              IMAGE_TAG=$(grep '^  tag:' helm-statuspage/values.yaml | awk '{print $2}' | tr -d '"')
              echo "📦 No custom tag provided, using values.yaml tag: $IMAGE_TAG"
            else
              echo "📦 Image tag from workflow_dispatch: $IMAGE_TAG"
            fi
            TRIGGER_SOURCE="workflow_dispatch"
            SOURCE_REPO="manual"
          else
            IMAGE_TAG="${{ github.sha }}"
            TRIGGER_SOURCE="push"
            SOURCE_REPO="${{ github.repository }}"
            echo "📦 Image tag from push event (SHA): $IMAGE_TAG"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "TRIGGER_SOURCE=$TRIGGER_SOURCE" >> $GITHUB_OUTPUT
          echo "SOURCE_REPO=$SOURCE_REPO" >> $GITHUB_OUTPUT

          echo "─────────────────────────────────────"
          echo "🏷️  Image Tag:      $IMAGE_TAG"
          echo "🔀 Trigger Source:  $TRIGGER_SOURCE"
          echo "📂 Source Repo:     $SOURCE_REPO"
          echo "👤 Actor:           ${{ github.actor }}"
          echo "🕐 Timestamp:       $TIMESTAMP"
          echo "─────────────────────────────────────"

  # ===========================================================
  # Stage 2: Validate Source & Security
  # ===========================================================
  validate-source:
    name: "Stage 2: Validate Source & Security"
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - name: Verify trigger source
        run: |
          TRIGGER="${{ needs.prepare.outputs.TRIGGER_SOURCE }}"
          SOURCE="${{ needs.prepare.outputs.SOURCE_REPO }}"
          IMAGE_TAG="${{ needs.prepare.outputs.IMAGE_TAG }}"

          echo "🔍 Validating deployment source..."
          echo "   Trigger:    $TRIGGER"
          echo "   Source:     $SOURCE"
          echo "   Image Tag:  $IMAGE_TAG"

          # Validate image tag is not empty
          if [ -z "$IMAGE_TAG" ]; then
            echo "❌ FAILED: Image tag is empty!"
            exit 1
          fi

          # For repository_dispatch, verify it came from status-page-app
          if [ "$TRIGGER" == "repository_dispatch" ]; then
            if [ "$SOURCE" != "status-page-app" ]; then
              echo "❌ FAILED: repository_dispatch from untrusted source: $SOURCE"
              echo "   Expected: status-page-app"
              exit 1
            fi
            echo "✅ Source verified: repository_dispatch from status-page-app"
          elif [ "$TRIGGER" == "workflow_dispatch" ]; then
            echo "✅ Manual trigger by: ${{ github.actor }}"
          elif [ "$TRIGGER" == "push" ]; then
            echo "✅ Push trigger on develop branch"
          fi

          # Validate image tag format (SHA or semver-like)
          if [[ "$IMAGE_TAG" =~ ^[a-f0-9]{7,40}$ ]] || [[ "$IMAGE_TAG" =~ ^v?[0-9]+\.[0-9]+ ]] || [[ "$IMAGE_TAG" == "latest" ]]; then
            echo "✅ Image tag format is valid: $IMAGE_TAG"
          else
            echo "⚠️ Warning: Unusual image tag format: $IMAGE_TAG (proceeding anyway)"
          fi

  # ===========================================================
  # Stage 3: Validate Infrastructure
  # ===========================================================
  validate-infrastructure:
    name: "Stage 3: Validate Infrastructure"
    runs-on: ubuntu-latest
    needs: [prepare, validate-source]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Terraform Format Check
        working-directory: Terraform/environments/dev
        run: |
          echo "🔍 Checking Terraform formatting..."
          terraform fmt -check -recursive ../../ || {
            echo "⚠️ Some files need formatting (non-blocking)"
          }
          echo "✅ Format check complete"

      - name: Terraform Init (validation mode)
        working-directory: Terraform/environments/dev
        run: |
          echo "🔍 Initializing Terraform (backend=false for validation)..."
          terraform init -backend=false
          echo "✅ Terraform init successful"

      - name: Terraform Validate
        working-directory: Terraform/environments/dev
        run: |
          echo "🔍 Validating Terraform configuration..."
          terraform validate
          echo "✅ Terraform configuration is valid"

      - name: Verify staging resources defined
        run: |
          echo "🔍 Checking staging infrastructure files..."

          # Check that critical modules exist
          for f in Terraform/modules/rds.tf Terraform/modules/elasticache.tf Terraform/modules/secrets.tf Terraform/modules/configmap.tf Terraform/modules/vpc.tf Terraform/modules/eks.tf; do
            if [ -f "$f" ]; then
              echo "  ✅ $f exists"
            else
              echo "  ❌ $f missing!"
              exit 1
            fi
          done

          echo "✅ All critical infrastructure files present"

  # ===========================================================
  # Stage 4: Validate Helm Charts
  # ===========================================================
  validate-helm:
    name: "Stage 4: Validate Helm Charts"
    runs-on: ubuntu-latest
    needs: [prepare, validate-source]
    permissions:
      contents: read
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Helm Lint
        run: |
          echo "🔍 Linting Helm chart..."
          helm lint helm-statuspage/
          echo "✅ Helm lint passed"

      - name: Helm Template (staging values)
        run: |
          echo "🔍 Rendering Helm templates with staging values..."
          helm template ${{ env.HELM_RELEASE_NAME }} ./helm-statuspage \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --values helm-statuspage/values.yaml \
            --values helm-statuspage/values-staging.yaml \
            --set image.tag=${{ needs.prepare.outputs.IMAGE_TAG }} \
            > /tmp/rendered-manifests.yaml
          echo "✅ Helm template rendering successful"

      - name: Validate no hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          RENDERED="/tmp/rendered-manifests.yaml"

          # Check for common secret patterns
          FOUND=0
          for pattern in "password:" "secret_key:" "aws_access_key" "aws_secret_key" "BEGIN RSA PRIVATE"; do
            if grep -i "$pattern" "$RENDERED" | grep -v "secretKeyRef" | grep -v "secretKey:" | grep -v "remoteRef" | grep -v "secretStoreRef" | grep -v "#" > /dev/null 2>&1; then
              echo "  ⚠️ Potential hardcoded secret found matching: $pattern"
              FOUND=$((FOUND + 1))
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "✅ No hardcoded secrets detected"
          else
            echo "⚠️ Found $FOUND potential issues - review above"
          fi

      - name: Verify resource limits defined
        run: |
          echo "🔍 Checking resource limits..."
          RENDERED="/tmp/rendered-manifests.yaml"

          if grep -A5 "resources:" "$RENDERED" | grep -q "limits:"; then
            echo "✅ Resource limits are defined"
          else
            echo "❌ Resource limits missing in manifests!"
            exit 1
          fi

      - name: Verify image from trusted ECR
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.IMAGE_TAG }}"
          echo "🔍 Verifying image source..."
          echo "   Expected ECR: ${{ env.ECR_REPOSITORY }}"
          echo "   Image tag:    $IMAGE_TAG"

          RENDERED="/tmp/rendered-manifests.yaml"
          if grep -q "${{ env.ECR_REPOSITORY }}" "$RENDERED"; then
            echo "✅ Image is from trusted ECR repository"
          else
            echo "❌ Image is NOT from trusted ECR repository!"
            exit 1
          fi

  # ===========================================================
  # Stage 5: Deploy to Staging
  # ===========================================================
  deploy-staging:
    name: "Stage 5: Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [prepare, validate-infrastructure, validate-helm]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          echo "✅ Connected to EKS cluster: ${{ env.EKS_CLUSTER_NAME }}"

      - name: Create staging namespace
        run: |
          if kubectl get namespace ${{ env.HELM_NAMESPACE }} >/dev/null 2>&1; then
            echo "✅ Namespace '${{ env.HELM_NAMESPACE }}' already exists"
          else
            kubectl create namespace ${{ env.HELM_NAMESPACE }}
            echo "✅ Created namespace '${{ env.HELM_NAMESPACE }}'"
          fi

      - name: Verify staging secrets exist
        run: |
          echo "🔍 Checking for required secrets in ${{ env.HELM_NAMESPACE }} namespace..."

          MISSING=0
          for secret in statuspage-secrets statuspage-github-secret; do
            if kubectl get secret "$secret" -n ${{ env.HELM_NAMESPACE }} >/dev/null 2>&1; then
              echo "  ✅ Secret '$secret' exists"
            else
              echo "  ⚠️ Secret '$secret' not found (will be created by ExternalSecret)"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "⚠️ $MISSING secret(s) missing - ExternalSecrets Operator should create them"
          fi

      - name: Deploy with Helm
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.IMAGE_TAG }}"
          echo "🚀 Deploying to staging..."
          echo "   Release:    ${{ env.HELM_RELEASE_NAME }}"
          echo "   Namespace:  ${{ env.HELM_NAMESPACE }}"
          echo "   Image Tag:  $IMAGE_TAG"
          echo "   Actor:      ${{ github.actor }}"
          echo "   Timestamp:  $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

          helm upgrade --install ${{ env.HELM_RELEASE_NAME }} ./helm-statuspage \
            --namespace ${{ env.HELM_NAMESPACE }} \
            --values helm-statuspage/values.yaml \
            --values helm-statuspage/values-staging.yaml \
            --set image.tag=$IMAGE_TAG \
            --wait \
            --timeout 10m \
            --atomic

          echo "✅ Helm deployment to staging successful"

      - name: Log deployment details
        run: |
          echo "════════════════════════════════════════"
          echo " STAGING DEPLOYMENT RECORD"
          echo "════════════════════════════════════════"
          echo " Image Tag:   ${{ needs.prepare.outputs.IMAGE_TAG }}"
          echo " Namespace:   ${{ env.HELM_NAMESPACE }}"
          echo " Cluster:     ${{ env.EKS_CLUSTER_NAME }}"
          echo " Trigger:     ${{ needs.prepare.outputs.TRIGGER_SOURCE }}"
          echo " Source:      ${{ needs.prepare.outputs.SOURCE_REPO }}"
          echo " Actor:       ${{ github.actor }}"
          echo " Timestamp:   $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "════════════════════════════════════════"

  # ===========================================================
  # Stage 6: Test Pod Health
  # ===========================================================
  test-pod-health:
    name: "Stage 6: Test Pod Health"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.health-check.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Wait for rollout
        run: |
          echo "⏳ Waiting for web deployment rollout..."
          kubectl rollout status deployment/${{ env.HELM_RELEASE_NAME }}-web \
            -n ${{ env.HELM_NAMESPACE }} --timeout=5m

          echo "⏳ Waiting for worker deployment rollout..."
          kubectl rollout status deployment/${{ env.HELM_RELEASE_NAME }}-worker \
            -n ${{ env.HELM_NAMESPACE }} --timeout=5m

          echo "⏳ Waiting for scheduler deployment rollout..."
          kubectl rollout status deployment/${{ env.HELM_RELEASE_NAME }}-scheduler \
            -n ${{ env.HELM_NAMESPACE }} --timeout=5m

          echo "✅ All deployments rolled out"

      - name: Check pod health
        id: health-check
        run: |
          echo "🔍 Checking pod health..."
          echo ""

          # Get all pods
          kubectl get pods -n ${{ env.HELM_NAMESPACE }} -o wide
          echo ""

          # Check for CrashLoopBackOff or Pending
          CRASH=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} --field-selector=status.phase!=Running,status.phase!=Succeeded --no-headers 2>/dev/null | wc -l)
          if [ "$CRASH" -gt 0 ]; then
            echo "❌ Found $CRASH unhealthy pods:"
            kubectl get pods -n ${{ env.HELM_NAMESPACE }} --field-selector=status.phase!=Running,status.phase!=Succeeded
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

          # Count running pods
          RUNNING=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)
          echo "📊 Running pods: $RUNNING"

          # Describe pods for debugging
          echo ""
          echo "─── Pod Details ───"
          kubectl describe pods -n ${{ env.HELM_NAMESPACE }} | head -100

      - name: Test health endpoint via port-forward
        continue-on-error: true
        run: |
          echo "🔍 Testing health endpoint..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "⚠️ No web pod found for health check"
            exit 0
          fi

          echo "   Pod: $POD_NAME"

          # Port-forward in background and test
          kubectl port-forward -n ${{ env.HELM_NAMESPACE }} "$POD_NAME" 8000:8000 &
          PF_PID=$!
          sleep 5

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ --max-time 10 2>/dev/null || echo "000")
          kill $PF_PID 2>/dev/null || true

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Health endpoint returned HTTP $HTTP_CODE"
          else
            echo "⚠️ Health endpoint returned HTTP $HTTP_CODE"
          fi

      - name: Check pod logs for errors
        continue-on-error: true
        run: |
          echo "🔍 Checking pod logs for errors..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -n "$POD_NAME" ]; then
            echo "─── Last 50 log lines from $POD_NAME ───"
            kubectl logs "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web --tail=50 2>/dev/null || echo "Could not fetch logs"

            # Count error lines
            ERROR_COUNT=$(kubectl logs "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web --tail=200 2>/dev/null | grep -ci "error\|exception\|traceback" || echo "0")
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "⚠️ Found $ERROR_COUNT error-related log lines"
            else
              echo "✅ No errors found in recent logs"
            fi
          fi

  # ===========================================================
  # Stage 7: Test Database
  # ===========================================================
  test-database:
    name: "Stage 7: Test Database"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.db-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test database connectivity
        id: db-test
        continue-on-error: true
        run: |
          echo "🔍 Testing database connectivity..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "   Using pod: $POD_NAME"

          # Test basic DB connection
          echo "─── Testing SELECT 1 ───"
          cat > /tmp/test_db_conn.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.db import connection
          cursor = connection.cursor()
          cursor.execute("SELECT 1")
          print("DB connection: OK -", cursor.fetchone())
          PYEOF
          kubectl cp /tmp/test_db_conn.py "$POD_NAME":/tmp/test_db_conn.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_db_conn.py 2>&1 && DB_OK=true || DB_OK=false

          if [ "$DB_OK" = true ]; then
            echo "✅ Database connection successful"
          else
            echo "❌ Database connection failed"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check migrations
          echo ""
          echo "─── Checking Migrations ───"
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python manage.py migrate --check 2>&1 && echo "✅ All migrations applied" || echo "⚠️ Pending migrations detected"

          # List tables
          echo ""
          echo "─── Database Tables ───"
          cat > /tmp/test_db_tables.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.db import connection
          cursor = connection.cursor()
          cursor.execute("SELECT tablename FROM pg_tables WHERE schemaname = 'public'")
          tables = cursor.fetchall()
          print("Total tables: {}".format(len(tables)))
          for t in tables[:20]:
              print("  - {}".format(t[0]))
          PYEOF
          kubectl cp /tmp/test_db_tables.py "$POD_NAME":/tmp/test_db_tables.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_db_tables.py 2>&1 || echo "⚠️ Could not list tables"

          echo "RESULT=PASS" >> $GITHUB_OUTPUT

  # ===========================================================
  # Stage 8: Test Configuration
  # ===========================================================
  test-configuration:
    name: "Stage 8: Test Configuration"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.config-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify configuration
        id: config-test
        run: |
          echo "🔍 Verifying application configuration..."
          PASS=0
          FAIL=0

          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check secrets are mounted
          echo "─── Checking Secrets ───"
          for secret in statuspage-secrets statuspage-github-secret; do
            if kubectl get secret "$secret" -n ${{ env.HELM_NAMESPACE }} >/dev/null 2>&1; then
              echo "  ✅ Secret '$secret' exists"
              PASS=$((PASS + 1))
            else
              echo "  ❌ Secret '$secret' missing"
              FAIL=$((FAIL + 1))
            fi
          done

          # Check environment variables
          echo ""
          echo "─── Checking Environment Variables ───"
          for var in DB_HOST DB_PORT DB_NAME DB_USER REDIS_HOST REDIS_PORT DJANGO_DEBUG ALLOWED_HOSTS; do
            VALUE=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv "$var" 2>/dev/null)
            if [ -n "$VALUE" ]; then
              # Mask sensitive values
              if [[ "$var" == *"PASS"* ]] || [[ "$var" == *"SECRET"* ]]; then
                echo "  ✅ $var = ****"
              else
                echo "  ✅ $var = $VALUE"
              fi
              PASS=$((PASS + 1))
            else
              echo "  ❌ $var is NOT set"
              FAIL=$((FAIL + 1))
            fi
          done

          # Check SECRET_KEY env (from secret mount)
          SECRET_KEY_SET=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv SECRET_KEY 2>/dev/null)
          if [ -n "$SECRET_KEY_SET" ]; then
            echo "  ✅ SECRET_KEY = **** (set from secret)"
            PASS=$((PASS + 1))
          else
            echo "  ❌ SECRET_KEY is NOT set"
            FAIL=$((FAIL + 1))
          fi

          # Verify DJANGO_DEBUG is False
          echo ""
          echo "─── Checking Safety Settings ───"
          DEBUG_VAL=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv DJANGO_DEBUG 2>/dev/null)
          if [ "$DEBUG_VAL" == "False" ]; then
            echo "  ✅ DJANGO_DEBUG = False (correct for staging)"
            PASS=$((PASS + 1))
          else
            echo "  ⚠️ DJANGO_DEBUG = $DEBUG_VAL (should be False)"
            FAIL=$((FAIL + 1))
          fi

          # Check ConfigMap
          echo ""
          echo "─── Checking ConfigMap ───"
          if kubectl get configmap statuspage-app-config -n ${{ env.HELM_NAMESPACE }} >/dev/null 2>&1; then
            echo "  ✅ ConfigMap 'statuspage-app-config' exists"
            PASS=$((PASS + 1))
          else
            echo "  ❌ ConfigMap 'statuspage-app-config' missing"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "📊 Configuration: $PASS passed, $FAIL failed"

          if [ "$FAIL" -gt 2 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 9: Test Redis
  # ===========================================================
  test-redis:
    name: "Stage 9: Test Redis"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.redis-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test Redis connectivity
        id: redis-test
        continue-on-error: true
        run: |
          echo "🔍 Testing Redis connectivity..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "⚠️ No web pod found for Redis test"
            echo "RESULT=SKIP" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Test Redis ping
          echo "─── Redis PING Test ───"
          cat > /tmp/test_redis_ping.py << 'PYEOF'
          import os, redis
          host = os.environ.get("REDIS_HOST", "localhost")
          port = int(os.environ.get("REDIS_PORT", 6379))
          print("Connecting to Redis at {}:{}...".format(host, port))
          r = redis.Redis(host=host, port=port, db=0, socket_timeout=5)
          print("PING: {}".format(r.ping()))
          info = r.info("server")
          print("Redis version: {}".format(info["redis_version"]))
          PYEOF
          kubectl cp /tmp/test_redis_ping.py "$POD_NAME":/tmp/test_redis_ping.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_redis_ping.py 2>&1 && REDIS_OK=true || REDIS_OK=false

          if [ "$REDIS_OK" = true ]; then
            echo "✅ Redis connection successful"
          else
            echo "⚠️ Redis connection failed (non-blocking)"
            echo "RESULT=WARN" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Test cache set/get
          echo ""
          echo "─── Redis Cache Set/Get Test ───"
          cat > /tmp/test_redis_cache.py << 'PYEOF'
          import os, redis
          host = os.environ.get("REDIS_HOST", "localhost")
          port = int(os.environ.get("REDIS_PORT", 6379))
          r = redis.Redis(host=host, port=port, db=1, socket_timeout=5)
          r.set("staging_test_key", "staging_test_value", ex=60)
          val = r.get("staging_test_key")
          print("Set/Get test: {}".format(val.decode()))
          r.delete("staging_test_key")
          print("Cleanup: key deleted")
          PYEOF
          kubectl cp /tmp/test_redis_cache.py "$POD_NAME":/tmp/test_redis_cache.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_redis_cache.py 2>&1 && echo "✅ Cache operations working" || echo "⚠️ Cache operations failed"

          echo "RESULT=PASS" >> $GITHUB_OUTPUT

  # ===========================================================
  # Stage 10: Test S3
  # ===========================================================
  test-s3:
    name: "Stage 10: Test S3"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.s3-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test S3 connectivity
        id: s3-test
        continue-on-error: true
        run: |
          echo "🔍 Testing S3 connectivity..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "⚠️ No web pod found for S3 test"
            echo "RESULT=SKIP" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check USE_S3 setting
          USE_S3=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv USE_S3 2>/dev/null)
          echo "   USE_S3 = $USE_S3"

          # Test basic S3 client creation
          echo "─── S3 Connection Test ───"
          cat > /tmp/test_s3.py << 'PYEOF'
          import boto3, os
          region = os.environ.get("AWS_REGION", "us-east-1")
          print("Creating S3 client in region {}...".format(region))
          s3 = boto3.client("s3", region_name=region)
          buckets = s3.list_buckets()
          print("S3 connection OK - found {} buckets".format(len(buckets["Buckets"])))
          for b in buckets["Buckets"][:5]:
              print("  - {}".format(b["Name"]))
          PYEOF
          kubectl cp /tmp/test_s3.py "$POD_NAME":/tmp/test_s3.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_s3.py 2>&1 && S3_OK=true || S3_OK=false

          if [ "$S3_OK" = true ]; then
            echo "✅ S3 connection successful"
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          else
            echo "⚠️ S3 connection failed (non-blocking - USE_S3=$USE_S3)"
            echo "RESULT=WARN" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 11: Test API Endpoints
  # ===========================================================
  test-api:
    name: "Stage 11: Test API Endpoints"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.api-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test API endpoints
        id: api-test
        run: |
          echo "🔍 Testing API endpoints..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Port-forward in background
          kubectl port-forward -n ${{ env.HELM_NAMESPACE }} "$POD_NAME" 8000:8000 &
          PF_PID=$!
          sleep 5

          PASS=0
          FAIL=0

          # Test 1: Root / health
          echo "─── Test: GET / ───"
          HTTP_CODE=$(curl -s -o /tmp/resp_root.txt -w "%{http_code}" http://localhost:8000/ --max-time 10 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "  ✅ GET / → HTTP $HTTP_CODE"
            PASS=$((PASS + 1))
          else
            echo "  ❌ GET / → HTTP $HTTP_CODE"
            FAIL=$((FAIL + 1))
          fi

          # Test 2: API status
          echo "─── Test: GET /api/status/ ───"
          HTTP_CODE=$(curl -s -o /tmp/resp_api.txt -w "%{http_code}" http://localhost:8000/api/status/ --max-time 10 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "  ✅ GET /api/status/ → HTTP $HTTP_CODE"
            # Validate JSON response
            if python3 -c "import json; json.load(open('/tmp/resp_api.txt'))" 2>/dev/null; then
              echo "  ✅ Response is valid JSON"
            else
              echo "  ⚠️ Response is not valid JSON"
            fi
            PASS=$((PASS + 1))
          elif [ "$HTTP_CODE" == "404" ]; then
            echo "  ⚠️ GET /api/status/ → HTTP 404 (endpoint may not exist)"
            PASS=$((PASS + 1))
          else
            echo "  ❌ GET /api/status/ → HTTP $HTTP_CODE"
            FAIL=$((FAIL + 1))
          fi

          # Test 3: Admin panel
          echo "─── Test: GET /admin/ ───"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L http://localhost:8000/admin/ --max-time 10 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "  ✅ GET /admin/ → HTTP $HTTP_CODE"
            PASS=$((PASS + 1))
          else
            echo "  ❌ GET /admin/ → HTTP $HTTP_CODE"
            FAIL=$((FAIL + 1))
          fi

          # Test 4: DB connectivity through app
          echo "─── Test: Database via Django ───"
          cat > /tmp/test_api_db.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.db import connection
          with connection.cursor() as c:
              c.execute("SELECT 1")
              print("DB query through Django: OK")
          PYEOF
          kubectl cp /tmp/test_api_db.py "$POD_NAME":/tmp/test_api_db.py -n ${{ env.HELM_NAMESPACE }} -c web
          if kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_api_db.py 2>&1; then
            echo "  ✅ Database connectivity through API"
            PASS=$((PASS + 1))
          else
            echo "  ❌ Database connectivity through API failed"
            FAIL=$((FAIL + 1))
          fi

          # Cleanup
          kill $PF_PID 2>/dev/null || true

          echo ""
          echo "📊 API Tests: $PASS passed, $FAIL failed"

          if [ "$FAIL" -gt 1 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 12: Container Security Scan (Trivy)
  # ===========================================================
  test-container-security:
    name: "Stage 12: Container Security Scan"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.trivy-scan.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin 992382545251.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Install Trivy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq trivy

      - name: Scan container image for vulnerabilities
        id: trivy-scan
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.IMAGE_TAG }}"
          FULL_IMAGE="${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "🔍 Scanning image: $FULL_IMAGE"
          echo ""

          # Run Trivy scan - CRITICAL and HIGH vulnerabilities
          echo "─── CRITICAL & HIGH Vulnerabilities ───"
          trivy image --severity CRITICAL,HIGH --no-progress "$FULL_IMAGE" > /tmp/trivy-report.txt 2>&1 || true
          cat /tmp/trivy-report.txt

          # Count critical vulnerabilities
          CRITICAL_COUNT=$(grep -c "CRITICAL" /tmp/trivy-report.txt 2>/dev/null || echo "0")
          HIGH_COUNT=$(grep -c "HIGH" /tmp/trivy-report.txt 2>/dev/null || echo "0")

          echo ""
          echo "─── Vulnerability Summary ───"
          echo "  🔴 CRITICAL: $CRITICAL_COUNT"
          echo "  🟠 HIGH:     $HIGH_COUNT"

          # Also run a summary scan
          echo ""
          echo "─── Full Summary ───"
          trivy image --severity CRITICAL,HIGH,MEDIUM --format table --no-progress "$FULL_IMAGE" 2>/dev/null | tail -20 || true

          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo ""
            echo "⚠️ CRITICAL vulnerabilities found - review before promoting to production!"
            echo "RESULT=WARN" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "✅ No CRITICAL vulnerabilities found"
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

      - name: Scan for secrets in image
        continue-on-error: true
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.IMAGE_TAG }}"
          FULL_IMAGE="${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          echo "🔍 Scanning image for embedded secrets..."
          trivy image --scanners secret --no-progress "$FULL_IMAGE" 2>&1 || true

  # ===========================================================
  # Stage 13: Test RQ Worker & Scheduler
  # ===========================================================
  test-worker-scheduler:
    name: "Stage 13: Test RQ Worker & Scheduler"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.worker-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Check Worker deployment status
        id: worker-test
        run: |
          echo "🔍 Testing RQ Worker & Scheduler..."
          PASS=0
          FAIL=0

          # ─── Check Worker Pods ───
          echo "─── Worker Deployment ───"
          WORKER_PODS=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-worker --no-headers 2>/dev/null | wc -l)
          WORKER_READY=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-worker --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)

          echo "  Worker pods: $WORKER_READY/$WORKER_PODS running"
          if [ "$WORKER_READY" -gt 0 ]; then
            echo "  ✅ Worker pods are running"
            PASS=$((PASS + 1))
          else
            echo "  ❌ No worker pods running!"
            FAIL=$((FAIL + 1))
          fi

          # ─── Check Scheduler Pod ───
          echo ""
          echo "─── Scheduler Deployment ───"
          SCHED_PODS=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-scheduler --no-headers 2>/dev/null | wc -l)
          SCHED_READY=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-scheduler --field-selector=status.phase=Running --no-headers 2>/dev/null | wc -l)

          echo "  Scheduler pods: $SCHED_READY/$SCHED_PODS running"
          if [ "$SCHED_READY" -eq 1 ]; then
            echo "  ✅ Scheduler pod is running (exactly 1 replica - correct)"
            PASS=$((PASS + 1))
          elif [ "$SCHED_READY" -gt 1 ]; then
            echo "  ⚠️ Multiple scheduler pods running ($SCHED_READY) - should be exactly 1!"
            FAIL=$((FAIL + 1))
          else
            echo "  ❌ Scheduler pod is not running!"
            FAIL=$((FAIL + 1))
          fi

          # ─── Check Worker Logs (no crash loops) ───
          echo ""
          echo "─── Worker Logs ───"
          WORKER_POD=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$WORKER_POD" ]; then
            kubectl logs "$WORKER_POD" -n ${{ env.HELM_NAMESPACE }} --tail=20 2>/dev/null || echo "  Could not fetch worker logs"

            # Check for errors in worker logs
            WORKER_ERRORS=$(kubectl logs "$WORKER_POD" -n ${{ env.HELM_NAMESPACE }} --tail=100 2>/dev/null | grep -ci "error\|traceback\|exception" || echo "0")
            if [ "$WORKER_ERRORS" -gt 3 ]; then
              echo "  ⚠️ Found $WORKER_ERRORS error lines in worker logs"
            else
              echo "  ✅ Worker logs look clean"
              PASS=$((PASS + 1))
            fi
          fi

          # ─── Test RQ Queue via Django ───
          echo ""
          echo "─── RQ Queue Status ───"
          WEB_POD=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$WEB_POD" ]; then
            cat > /tmp/test_rq_queues.py << 'PYEOF'
            import django, os, sys
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
            django.setup()
            try:
                import redis as redis_lib
                host = os.environ.get("REDIS_HOST", "localhost")
                port = int(os.environ.get("REDIS_PORT", 6379))
                conn = redis_lib.Redis(host=host, port=port, db=0)
                from rq import Queue
                q = Queue(connection=conn)
                workers_count = len(q.workers)
                jobs_count = q.count
                print("Queue: {} jobs, {} workers".format(jobs_count, workers_count))
                if workers_count > 0:
                    print("WORKERS_CONNECTED=true")
                else:
                    print("WORKERS_CONNECTED=false")
            except Exception as e:
                print("RQ check error: {}".format(e))
                print("WORKERS_CONNECTED=unknown")
            PYEOF
            kubectl cp /tmp/test_rq_queues.py "$WEB_POD":/tmp/test_rq_queues.py -n ${{ env.HELM_NAMESPACE }} -c web
            RQ_OUTPUT=$(kubectl exec "$WEB_POD" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_rq_queues.py 2>&1)
            echo "$RQ_OUTPUT"

            if echo "$RQ_OUTPUT" | grep -q "WORKERS_CONNECTED=true"; then
              echo "  ✅ RQ workers are connected to the queue"
              PASS=$((PASS + 1))
            else
              echo "  ⚠️ RQ workers may not be connected (non-blocking)"
            fi
          fi

          # ─── Test RQ Job Execution ───
          echo ""
          echo "─── RQ Job Execution Test ───"
          if [ -n "$WEB_POD" ]; then
            cat > /tmp/test_rq_job.py << 'PYEOF'
            import django, os, time
            os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
            django.setup()
            try:
                import redis as redis_lib
                host = os.environ.get("REDIS_HOST", "localhost")
                port = int(os.environ.get("REDIS_PORT", 6379))
                conn = redis_lib.Redis(host=host, port=port, db=0)
                from rq import Queue
                q = Queue(connection=conn)
                job = q.enqueue(len, [1, 2, 3])
                print("Job enqueued: " + str(job.id))
                for i in range(10):
                    time.sleep(1)
                    job.refresh()
                    if job.is_finished:
                        print("Job finished, result: " + str(job.result))
                        print("JOB_EXECUTED=true")
                        break
                    elif job.is_failed:
                        print("Job failed")
                        print("JOB_EXECUTED=false")
                        break
                else:
                    print("Job still pending after 10s")
                    print("JOB_EXECUTED=timeout")
            except Exception as e:
                print("RQ job test error: " + str(e))
                print("JOB_EXECUTED=error")
            PYEOF
            kubectl cp /tmp/test_rq_job.py "$WEB_POD":/tmp/test_rq_job.py -n ${{ env.HELM_NAMESPACE }} -c web
            JOB_OUTPUT=$(kubectl exec "$WEB_POD" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_rq_job.py 2>&1)
            echo "$JOB_OUTPUT"

            if echo "$JOB_OUTPUT" | grep -q "JOB_EXECUTED=true"; then
              echo "  ✅ RQ worker processed a test job successfully"
              PASS=$((PASS + 1))
            else
              echo "  ⚠️ RQ job execution test inconclusive"
            fi
          fi

          echo ""
          echo "📊 Worker/Scheduler Tests: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 14: Test Django Admin Login
  # ===========================================================
  test-admin-login:
    name: "Stage 14: Test Django Admin Login"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.admin-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test Django admin login
        id: admin-test
        run: |
          echo "🔍 Testing Django admin login..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Test 1: Verify superuser exists
          echo "─── Check Superuser Exists ───"
          cat > /tmp/test_admin_user.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.contrib.auth import get_user_model
          User = get_user_model()
          superusers = User.objects.filter(is_superuser=True)
          print("Superusers found: " + str(superusers.count()))
          for u in superusers:
              print("  - " + u.username + " active=" + str(u.is_active))
          if superusers.exists():
              print("ADMIN_EXISTS=true")
          else:
              print("ADMIN_EXISTS=false")
          PYEOF
          kubectl cp /tmp/test_admin_user.py "$POD_NAME":/tmp/test_admin_user.py -n ${{ env.HELM_NAMESPACE }} -c web
          ADMIN_OUTPUT=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_admin_user.py 2>&1)
          echo "$ADMIN_OUTPUT"

          PASS=0
          FAIL=0

          if echo "$ADMIN_OUTPUT" | grep -q "ADMIN_EXISTS=true"; then
            echo "  ✅ Admin superuser exists"
            PASS=$((PASS + 1))
          else
            echo "  ❌ No superuser found!"
            FAIL=$((FAIL + 1))
          fi

          # Test 2: Verify admin login via Django test client
          echo ""
          echo "─── Test Admin Authentication ───"
          cat > /tmp/test_admin_auth.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.test import Client
          from django.contrib.auth import get_user_model
          User = get_user_model()
          client = Client()
          response = client.get("/admin/login/")
          print("GET /admin/login/ -> HTTP " + str(response.status_code))
          if response.status_code == 200:
              print("ADMIN_LOGIN_PAGE=true")
              content = response.content.decode()
              if "csrfmiddlewaretoken" in content:
                  print("CSRF_ENABLED=true")
              else:
                  print("CSRF_ENABLED=false")
          else:
              print("ADMIN_LOGIN_PAGE=false")
          response = client.get("/admin/")
          print("GET /admin/ -> HTTP " + str(response.status_code))
          if response.status_code in [301, 302]:
              print("ADMIN_PROTECTED=true")
          else:
              print("ADMIN_PROTECTED=false")
          PYEOF
          kubectl cp /tmp/test_admin_auth.py "$POD_NAME":/tmp/test_admin_auth.py -n ${{ env.HELM_NAMESPACE }} -c web
          AUTH_OUTPUT=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_admin_auth.py 2>&1)
          echo "$AUTH_OUTPUT"

          if echo "$AUTH_OUTPUT" | grep -q "ADMIN_LOGIN_PAGE=true"; then
            echo "  ✅ Admin login page loads correctly"
            PASS=$((PASS + 1))
          else
            echo "  ❌ Admin login page failed"
            FAIL=$((FAIL + 1))
          fi

          if echo "$AUTH_OUTPUT" | grep -q "ADMIN_PROTECTED=true"; then
            echo "  ✅ Admin panel requires authentication (protected)"
            PASS=$((PASS + 1))
          else
            echo "  ⚠️ Admin panel may not be properly protected"
            FAIL=$((FAIL + 1))
          fi

          if echo "$AUTH_OUTPUT" | grep -q "CSRF_ENABLED=true"; then
            echo "  ✅ CSRF protection is enabled"
            PASS=$((PASS + 1))
          else
            echo "  ⚠️ CSRF protection not detected"
          fi

          echo ""
          echo "📊 Admin Tests: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 1 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 15: Test All Django Routes
  # ===========================================================
  test-django-routes:
    name: "Stage 15: Test All Django Routes"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.routes-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Discover and test all Django routes
        id: routes-test
        run: |
          echo "🔍 Discovering and testing all Django URL routes..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Step 1: Discover all registered URL patterns
          echo "─── Discovering URL Patterns ───"
          cat > /tmp/discover_urls.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.urls import get_resolver
          def list_urls(resolver=None, prefix=""):
              if resolver is None:
                  resolver = get_resolver()
              urls = []
              for pattern in resolver.url_patterns:
                  full_pattern = prefix + str(pattern.pattern)
                  if hasattr(pattern, "url_patterns"):
                      urls.extend(list_urls(pattern, full_pattern))
                  else:
                      name = getattr(pattern, "name", None) or "unnamed"
                      urls.append((full_pattern, name))
              return urls
          all_urls = list_urls()
          print("Total URL patterns found: " + str(len(all_urls)))
          for url, name in sorted(all_urls):
              print("  " + url + " [" + name + "]")
          PYEOF
          kubectl cp /tmp/discover_urls.py "$POD_NAME":/tmp/discover_urls.py -n ${{ env.HELM_NAMESPACE }} -c web
          kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/discover_urls.py 2>&1

          # Step 2: Test all safe GET endpoints
          echo ""
          echo "─── Testing GET Endpoints ───"
          cat > /tmp/test_all_routes.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.test import Client
          from django.urls import get_resolver
          client = Client()
          def get_testable_urls(resolver=None, prefix=""):
              if resolver is None:
                  resolver = get_resolver()
              urls = []
              for pattern in resolver.url_patterns:
                  full_pattern = prefix + str(pattern.pattern)
                  if hasattr(pattern, "url_patterns"):
                      urls.extend(get_testable_urls(pattern, full_pattern))
                  else:
                      path = "/" + full_pattern.replace("^", "").replace("$", "")
                      if "<" not in path and "(" not in path and "?" not in path:
                          name = getattr(pattern, "name", None) or "unnamed"
                          urls.append((path, name))
              return urls
          testable = get_testable_urls()
          passed = 0
          failed = 0
          warned = 0
          print("Testing " + str(len(testable)) + " URL endpoints...")
          print("")
          for path, name in sorted(set(testable)):
              try:
                  response = client.get(path, follow=False)
                  code = response.status_code
                  if 200 <= code < 400:
                      print("  PASS  " + path + " -> HTTP " + str(code) + " [" + name + "]")
                      passed += 1
                  elif code in [401, 403, 302, 301]:
                      print("  OK    " + path + " -> HTTP " + str(code) + " (auth) [" + name + "]")
                      passed += 1
                  elif code == 404:
                      print("  WARN  " + path + " -> HTTP " + str(code) + " [" + name + "]")
                      warned += 1
                  elif code == 405:
                      print("  OK    " + path + " -> HTTP " + str(code) + " (POST only) [" + name + "]")
                      passed += 1
                  else:
                      print("  FAIL  " + path + " -> HTTP " + str(code) + " [" + name + "]")
                      failed += 1
              except Exception as e:
                  print("  ERROR " + path + " -> " + str(e)[:80])
                  failed += 1
          print("")
          print("Results: " + str(passed) + " passed, " + str(warned) + " warned, " + str(failed) + " failed")
          if failed == 0:
              print("ROUTES_RESULT=PASS")
          elif failed <= 2:
              print("ROUTES_RESULT=WARN")
          else:
              print("ROUTES_RESULT=FAIL")
          PYEOF
          kubectl cp /tmp/test_all_routes.py "$POD_NAME":/tmp/test_all_routes.py -n ${{ env.HELM_NAMESPACE }} -c web
          ROUTES_OUTPUT=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_all_routes.py 2>&1)
          echo "$ROUTES_OUTPUT"

          if echo "$ROUTES_OUTPUT" | grep -q "ROUTES_RESULT=PASS"; then
            echo "✅ All Django routes responding correctly"
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          elif echo "$ROUTES_OUTPUT" | grep -q "ROUTES_RESULT=WARN"; then
            echo "⚠️ Some routes returned warnings"
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          else
            echo "❌ Multiple route failures detected"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 16: Test Static Files & S3 Serving
  # ===========================================================
  test-static-files:
    name: "Stage 16: Test Static Files & S3 Serving"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.static-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test static files and S3 serving
        id: static-test
        run: |
          echo "🔍 Testing static files and S3 serving..."
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "❌ No web pod found"
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
            exit 0
          fi

          PASS=0
          FAIL=0

          # Test 1: Run collectstatic --dry-run
          echo "─── collectstatic --dry-run ───"
          COLLECT_OUTPUT=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python manage.py collectstatic --dry-run --noinput 2>&1) || true
          echo "$COLLECT_OUTPUT" | tail -5
          if echo "$COLLECT_OUTPUT" | grep -qi "static file"; then
            echo "  ✅ collectstatic found static files"
            PASS=$((PASS + 1))
          else
            echo "  ⚠️ collectstatic output unexpected"
          fi

          # Test 2: Check if USE_S3 is configured
          echo ""
          echo "─── S3 Static Storage Config ───"
          cat > /tmp/test_static_config.py << 'PYEOF'
          import django, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "statuspage.settings")
          django.setup()
          from django.conf import settings
          use_s3 = os.environ.get("USE_S3", "False")
          print("USE_S3 = " + use_s3)
          print("STATIC_URL = " + settings.STATIC_URL)
          storage = getattr(settings, "STATICFILES_STORAGE", "default")
          print("STATICFILES_STORAGE = " + storage)
          bucket = os.environ.get("AWS_STORAGE_BUCKET_NAME", "not set")
          print("AWS_STORAGE_BUCKET_NAME = " + bucket)
          if use_s3 == "True":
              print("S3_CONFIGURED=true")
          else:
              print("S3_CONFIGURED=false")
          PYEOF
          kubectl cp /tmp/test_static_config.py "$POD_NAME":/tmp/test_static_config.py -n ${{ env.HELM_NAMESPACE }} -c web
          STATIC_OUTPUT=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- python /tmp/test_static_config.py 2>&1)
          echo "$STATIC_OUTPUT"

          if echo "$STATIC_OUTPUT" | grep -q "S3_CONFIGURED=true"; then
            echo "  ✅ S3 static file serving is configured"
            PASS=$((PASS + 1))

            # Test 3: Verify S3 bucket access for static files
            echo ""
            echo "─── S3 Bucket Write Test ───"
            BUCKET=$(echo "$STATIC_OUTPUT" | grep "AWS_STORAGE_BUCKET_NAME" | awk -F'= ' '{print $2}')
            if [ -n "$BUCKET" ] && [ "$BUCKET" != "not set" ]; then
              echo "test-static-$(date +%s)" > /tmp/test-static.txt
              if aws s3 cp /tmp/test-static.txt "s3://$BUCKET/_staging_test/test.txt" --quiet 2>/dev/null; then
                echo "  ✅ S3 write successful"
                aws s3 rm "s3://$BUCKET/_staging_test/test.txt" --quiet 2>/dev/null
                echo "  ✅ S3 cleanup done"
                PASS=$((PASS + 1))
              else
                echo "  ⚠️ S3 write failed (may need IRSA permissions)"
              fi
            fi
          else
            echo "  ℹ️ S3 not configured (using local static files)"
            PASS=$((PASS + 1))
          fi

          # Test 4: Verify static files are accessible via HTTP
          echo ""
          echo "─── HTTP Static File Test ───"
          kubectl port-forward -n ${{ env.HELM_NAMESPACE }} "$POD_NAME" 8000:8000 &
          PF_PID=$!
          sleep 5

          # Try to load the admin CSS (Django ships this by default)
          ADMIN_CSS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/static/admin/css/base.css --max-time 10 2>/dev/null || echo "000")
          kill $PF_PID 2>/dev/null || true

          if [ "$ADMIN_CSS" -ge 200 ] && [ "$ADMIN_CSS" -lt 400 ]; then
            echo "  ✅ Static files served via HTTP: /static/admin/css/base.css → HTTP $ADMIN_CSS"
            PASS=$((PASS + 1))
          elif [ "$ADMIN_CSS" == "404" ]; then
            echo "  ⚠️ Admin CSS not found (may need collectstatic in production)"
          else
            echo "  ⚠️ Static file test: HTTP $ADMIN_CSS"
          fi

          echo ""
          echo "📊 Static Files Tests: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 17: Test Ingress & ALB External Access
  # ===========================================================
  test-ingress-alb:
    name: "Stage 17: Test Ingress & ALB External Access"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.ingress-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Test Ingress and ALB
        id: ingress-test
        run: |
          echo "🔍 Testing Ingress & ALB external access..."
          PASS=0
          FAIL=0

          # Test 1: Check Ingress resource exists
          echo "─── Ingress Resource ───"
          INGRESS_COUNT=$(kubectl get ingress -n ${{ env.HELM_NAMESPACE }} --no-headers 2>/dev/null | wc -l)
          if [ "$INGRESS_COUNT" -gt 0 ]; then
            echo "  ✅ Ingress resource exists ($INGRESS_COUNT)"
            kubectl get ingress -n ${{ env.HELM_NAMESPACE }} 2>/dev/null
            PASS=$((PASS + 1))
          else
            echo "  ⚠️ No Ingress resource found in ${{ env.HELM_NAMESPACE }}"
          fi

          # Test 2: Get ALB hostname
          echo ""
          echo "─── ALB Hostname ───"
          ALB_HOST=$(kubectl get ingress -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -n "$ALB_HOST" ]; then
            echo "  ✅ ALB hostname: $ALB_HOST"
            PASS=$((PASS + 1))

            # Test 3: HTTP access to ALB
            echo ""
            echo "─── External HTTP Test ───"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://$ALB_HOST/" --max-time 15 -H "Host: $ALB_HOST" 2>/dev/null || echo "000")
            echo "  GET http://$ALB_HOST/ → HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
              echo "  ✅ ALB is responding to HTTP traffic"
              PASS=$((PASS + 1))
            elif [ "$HTTP_CODE" == "301" ] || [ "$HTTP_CODE" == "302" ]; then
              echo "  ✅ ALB redirects (likely HTTP→HTTPS)"
              PASS=$((PASS + 1))
            else
              echo "  ⚠️ ALB returned HTTP $HTTP_CODE (may need time to provision)"
            fi

            # Test 4: HTTPS access to ALB
            echo ""
            echo "─── External HTTPS Test ───"
            HTTPS_CODE=$(curl -sk -o /dev/null -w "%{http_code}" "https://$ALB_HOST/" --max-time 15 2>/dev/null || echo "000")
            echo "  GET https://$ALB_HOST/ → HTTP $HTTPS_CODE"
            if [ "$HTTPS_CODE" -ge 200 ] && [ "$HTTPS_CODE" -lt 500 ]; then
              echo "  ✅ ALB is responding to HTTPS traffic"
              PASS=$((PASS + 1))
            else
              echo "  ⚠️ HTTPS returned $HTTPS_CODE (cert may not be attached yet)"
            fi
          else
            echo "  ⚠️ ALB hostname not yet assigned (may still be provisioning)"
          fi

          # Test 5: Check ALB annotations
          echo ""
          echo "─── Ingress Annotations ───"
          ANNOTATIONS=$(kubectl get ingress -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.items[0].metadata.annotations}' 2>/dev/null)
          if echo "$ANNOTATIONS" | grep -q "internet-facing"; then
            echo "  ✅ ALB scheme: internet-facing"
            PASS=$((PASS + 1))
          fi
          if echo "$ANNOTATIONS" | grep -q "ip"; then
            echo "  ✅ Target type: ip"
            PASS=$((PASS + 1))
          fi
          if echo "$ANNOTATIONS" | grep -q "healthcheck-path"; then
            echo "  ✅ Healthcheck path configured"
            PASS=$((PASS + 1))
          fi

          # Test 6: Check Service endpoints
          echo ""
          echo "─── Service Endpoints ───"
          SVC_ENDPOINTS=$(kubectl get endpoints ${{ env.HELM_RELEASE_NAME }}-web -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.subsets[0].addresses}' 2>/dev/null)
          if [ -n "$SVC_ENDPOINTS" ] && [ "$SVC_ENDPOINTS" != "null" ]; then
            ENDPOINT_COUNT=$(kubectl get endpoints ${{ env.HELM_RELEASE_NAME }}-web -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.subsets[0].addresses}' 2>/dev/null | grep -o "ip" | wc -l)
            echo "  ✅ Service has $ENDPOINT_COUNT active endpoint(s)"
            PASS=$((PASS + 1))
          else
            echo "  ❌ Service has no active endpoints!"
            FAIL=$((FAIL + 1))
          fi

          echo ""
          echo "📊 Ingress/ALB Tests: $PASS passed, $FAIL failed"
          if [ "$FAIL" -gt 0 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 18: Network Security Audit
  # ===========================================================
  test-network-security:
    name: "Stage 18: Network Security Audit"
    runs-on: ubuntu-latest
    needs: [prepare, deploy-staging]
    permissions:
      id-token: write
      contents: read
    outputs:
      RESULT: ${{ steps.network-test.outputs.RESULT }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Network security audit
        id: network-test
        run: |
          echo "🔍 Running network security audit..."
          PASS=0
          FAIL=0
          WARN=0

          # Test 1: Verify only expected ports are exposed via Service
          echo "─── Exposed Services & Ports ───"
          kubectl get svc -n ${{ env.HELM_NAMESPACE }} -o custom-columns='NAME:.metadata.name,TYPE:.spec.type,PORTS:.spec.ports[*].port,TARGET:.spec.ports[*].targetPort' 2>/dev/null
          echo ""

          SVC_TYPE=$(kubectl get svc ${{ env.HELM_RELEASE_NAME }}-web -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.spec.type}' 2>/dev/null)
          if [ "$SVC_TYPE" == "ClusterIP" ]; then
            echo "  ✅ Web service is ClusterIP (not directly exposed)"
            PASS=$((PASS + 1))
          elif [ "$SVC_TYPE" == "LoadBalancer" ]; then
            echo "  ⚠️ Web service is LoadBalancer type (directly exposed!)"
            WARN=$((WARN + 1))
          elif [ "$SVC_TYPE" == "NodePort" ]; then
            echo "  ⚠️ Web service is NodePort type"
            WARN=$((WARN + 1))
          fi

          # Test 2: Check for unexpected services
          echo ""
          echo "─── Check for Unexpected Services ───"
          ALL_SVCS=$(kubectl get svc -n ${{ env.HELM_NAMESPACE }} --no-headers 2>/dev/null | awk '{print $1}')
          for svc in $ALL_SVCS; do
            SVC_T=$(kubectl get svc "$svc" -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.spec.type}' 2>/dev/null)
            if [ "$SVC_T" == "LoadBalancer" ] || [ "$SVC_T" == "NodePort" ]; then
              echo "  ⚠️ $svc ($SVC_T) - externally accessible"
              WARN=$((WARN + 1))
            else
              echo "  ✅ $svc ($SVC_T) - internal only"
              PASS=$((PASS + 1))
            fi
          done

          # Test 3: Verify pod cannot access outside of expected ports
          echo ""
          echo "─── Pod Network Connectivity Test ───"
          POD_NAME=$(kubectl get pods -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          if [ -n "$POD_NAME" ]; then
            # Check DB port (5432) - should be accessible
            DB_HOST=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv DB_HOST 2>/dev/null)
            if [ -n "$DB_HOST" ]; then
              DB_CONN=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- timeout 5 bash -c "echo > /dev/tcp/$DB_HOST/5432" 2>&1 && echo "open" || echo "closed")
              if [ "$DB_CONN" == "open" ]; then
                echo "  ✅ Pod → DB (port 5432): accessible (expected)"
                PASS=$((PASS + 1))
              else
                echo "  ❌ Pod → DB (port 5432): NOT accessible!"
                FAIL=$((FAIL + 1))
              fi
            fi

            # Check Redis port (6379) - should be accessible
            REDIS_HOST=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv REDIS_HOST 2>/dev/null)
            if [ -n "$REDIS_HOST" ]; then
              REDIS_CONN=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- timeout 5 bash -c "echo > /dev/tcp/$REDIS_HOST/6379" 2>&1 && echo "open" || echo "closed")
              if [ "$REDIS_CONN" == "open" ]; then
                echo "  ✅ Pod → Redis (port 6379): accessible (expected)"
                PASS=$((PASS + 1))
              else
                echo "  ⚠️ Pod → Redis (port 6379): NOT accessible"
                WARN=$((WARN + 1))
              fi
            fi

            # Check that DB port is not exposed on unexpected port
            SSH_TEST=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- timeout 3 bash -c "echo > /dev/tcp/$DB_HOST/22" 2>&1 && echo "open" || echo "closed")
            if [ "$SSH_TEST" == "closed" ]; then
              echo "  ✅ DB host SSH (port 22): closed (expected)"
              PASS=$((PASS + 1))
            else
              echo "  ⚠️ DB host SSH (port 22): OPEN"
              WARN=$((WARN + 1))
            fi
          fi

          # Test 4: Check NetworkPolicies
          echo ""
          echo "─── Kubernetes Network Policies ───"
          NP_COUNT=$(kubectl get networkpolicies -n ${{ env.HELM_NAMESPACE }} --no-headers 2>/dev/null | wc -l)
          if [ "$NP_COUNT" -gt 0 ]; then
            echo "  ✅ NetworkPolicies found: $NP_COUNT"
            kubectl get networkpolicies -n ${{ env.HELM_NAMESPACE }} 2>/dev/null
            PASS=$((PASS + 1))
          else
            echo "  ℹ️ No NetworkPolicies defined (recommended for production)"
          fi

          # Test 5: Verify Security Groups via AWS
          echo ""
          echo "─── AWS Security Groups ───"
          # Get node security group
          NODE_SG=$(aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --query 'cluster.resourcesVpcConfig.clusterSecurityGroupId' --output text 2>/dev/null)
          if [ -n "$NODE_SG" ]; then
            echo "  Cluster SG: $NODE_SG"
            # Check inbound rules
            INBOUND_RULES=$(aws ec2 describe-security-groups --group-ids "$NODE_SG" --region ${{ env.AWS_REGION }} --query 'SecurityGroups[0].IpPermissions' --output json 2>/dev/null)
            OPEN_RULES=$(echo "$INBOUND_RULES" | grep -c '"0.0.0.0/0"' 2>/dev/null || echo "0")
            if [ "$OPEN_RULES" -gt 0 ]; then
              echo "  ⚠️ Cluster SG has $OPEN_RULES rules open to 0.0.0.0/0"
              WARN=$((WARN + 1))
            else
              echo "  ✅ Cluster SG has no 0.0.0.0/0 inbound rules"
              PASS=$((PASS + 1))
            fi
          fi

          # Test 6: Check DJANGO_DEBUG is False
          echo ""
          echo "─── Application Security Settings ───"
          if [ -n "$POD_NAME" ]; then
            DEBUG_VAL=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv DJANGO_DEBUG 2>/dev/null)
            if [ "$DEBUG_VAL" == "False" ]; then
              echo "  ✅ DJANGO_DEBUG = False"
              PASS=$((PASS + 1))
            else
              echo "  ❌ DJANGO_DEBUG = $DEBUG_VAL (should be False!)"
              FAIL=$((FAIL + 1))
            fi

            # Check ALLOWED_HOSTS
            ALLOWED=$(kubectl exec "$POD_NAME" -n ${{ env.HELM_NAMESPACE }} -c web -- printenv ALLOWED_HOSTS 2>/dev/null)
            echo "  ALLOWED_HOSTS = $ALLOWED"
            if [ "$ALLOWED" == "*" ]; then
              echo "  ⚠️ ALLOWED_HOSTS is wildcard (restrict for production)"
              WARN=$((WARN + 1))
            else
              echo "  ✅ ALLOWED_HOSTS is restricted"
              PASS=$((PASS + 1))
            fi
          fi

          echo ""
          echo "═══════════════════════════════════════"
          echo "📊 Network Security: $PASS passed, $WARN warnings, $FAIL failed"
          echo "═══════════════════════════════════════"

          if [ "$FAIL" -gt 0 ]; then
            echo "RESULT=FAIL" >> $GITHUB_OUTPUT
          elif [ "$WARN" -gt 3 ]; then
            echo "RESULT=WARN" >> $GITHUB_OUTPUT
          else
            echo "RESULT=PASS" >> $GITHUB_OUTPUT
          fi

  # ===========================================================
  # Stage 19: Generate Summary Report
  # ===========================================================
  summary-report:
    name: "Stage 19: Summary Report"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - prepare
      - validate-source
      - validate-infrastructure
      - validate-helm
      - deploy-staging
      - test-pod-health
      - test-database
      - test-configuration
      - test-redis
      - test-s3
      - test-api
      - test-container-security
      - test-worker-scheduler
      - test-admin-login
      - test-django-routes
      - test-static-files
      - test-ingress-alb
      - test-network-security
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'
        continue-on-error: true

      - name: Update kubeconfig
        continue-on-error: true
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Show Kubernetes resources
        continue-on-error: true
        run: |
          echo "════════════════════════════════════════════"
          echo " KUBERNETES RESOURCES IN STAGING"
          echo "════════════════════════════════════════════"
          echo ""
          echo "─── Pods ───"
          kubectl get pods -n ${{ env.HELM_NAMESPACE }} -o wide 2>/dev/null || echo "Could not fetch pods"
          echo ""
          echo "─── Services ───"
          kubectl get svc -n ${{ env.HELM_NAMESPACE }} 2>/dev/null || echo "Could not fetch services"
          echo ""
          echo "─── Ingress ───"
          kubectl get ingress -n ${{ env.HELM_NAMESPACE }} 2>/dev/null || echo "Could not fetch ingress"
          echo ""
          echo "─── Helm Release ───"
          helm list -n ${{ env.HELM_NAMESPACE }} 2>/dev/null || echo "Could not fetch helm releases"

      - name: Get staging URL
        continue-on-error: true
        id: staging-url
        run: |
          ALB_URL=$(kubectl get ingress -n ${{ env.HELM_NAMESPACE }} -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -n "$ALB_URL" ]; then
            echo "STAGING_URL=http://$ALB_URL" >> $GITHUB_OUTPUT
            echo "🌐 Staging URL: http://$ALB_URL"
          else
            echo "STAGING_URL=N/A" >> $GITHUB_OUTPUT
            echo "⚠️ No staging ingress URL available"
          fi

      - name: Generate summary report
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════╗"
          echo "║         STAGING DEPLOYMENT SUMMARY REPORT               ║"
          echo "╚══════════════════════════════════════════════════════════╝"
          echo ""
          echo "─── Deployment Metadata ───"
          echo "  🏷️  Image Tag:       ${{ needs.prepare.outputs.IMAGE_TAG }}"
          echo "  🔀 Trigger:          ${{ needs.prepare.outputs.TRIGGER_SOURCE }}"
          echo "  📂 Source:           ${{ needs.prepare.outputs.SOURCE_REPO }}"
          echo "  👤 Actor:            ${{ github.actor }}"
          echo "  🕐 Timestamp:        ${{ needs.prepare.outputs.DEPLOY_TIMESTAMP }}"
          echo "  🌐 Staging URL:      ${{ steps.staging-url.outputs.STAGING_URL }}"
          echo ""
          echo "─── Stage Results ───"

          TOTAL_PASS=0
          TOTAL_FAIL=0

          # Stage 1: Prepare
          if [ "${{ needs.prepare.result }}" == "success" ]; then
            echo "  ✅ Stage 1:  Prepare"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 1:  Prepare"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 2: Validate Source
          if [ "${{ needs.validate-source.result }}" == "success" ]; then
            echo "  ✅ Stage 2:  Validate Source & Security"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 2:  Validate Source & Security"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 3: Validate Infrastructure
          if [ "${{ needs.validate-infrastructure.result }}" == "success" ]; then
            echo "  ✅ Stage 3:  Validate Infrastructure"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 3:  Validate Infrastructure"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 4: Validate Helm
          if [ "${{ needs.validate-helm.result }}" == "success" ]; then
            echo "  ✅ Stage 4:  Validate Helm Charts"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 4:  Validate Helm Charts"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 5: Deploy
          if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
            echo "  ✅ Stage 5:  Deploy to Staging"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 5:  Deploy to Staging"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 6: Pod Health
          if [ "${{ needs.test-pod-health.result }}" == "success" ]; then
            echo "  ✅ Stage 6:  Pod Health"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 6:  Pod Health"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 7: Database
          if [ "${{ needs.test-database.result }}" == "success" ]; then
            echo "  ✅ Stage 7:  Database"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 7:  Database"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 8: Configuration
          if [ "${{ needs.test-configuration.result }}" == "success" ]; then
            echo "  ✅ Stage 8:  Configuration"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 8:  Configuration"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 9: Redis
          if [ "${{ needs.test-redis.result }}" == "success" ]; then
            echo "  ✅ Stage 9:  Redis"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 9:  Redis (optional)"
          fi

          # Stage 10: S3
          if [ "${{ needs.test-s3.result }}" == "success" ]; then
            echo "  ✅ Stage 10: S3"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 10: S3 (optional)"
          fi

          # Stage 11: API
          if [ "${{ needs.test-api.result }}" == "success" ]; then
            echo "  ✅ Stage 11: API Endpoints"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 11: API Endpoints"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 12: Container Security
          if [ "${{ needs.test-container-security.result }}" == "success" ]; then
            echo "  ✅ Stage 12: Container Security Scan"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 12: Container Security Scan"
          fi

          # Stage 13: Worker/Scheduler
          if [ "${{ needs.test-worker-scheduler.result }}" == "success" ]; then
            echo "  ✅ Stage 13: RQ Worker & Scheduler"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 13: RQ Worker & Scheduler"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 14: Admin Login
          if [ "${{ needs.test-admin-login.result }}" == "success" ]; then
            echo "  ✅ Stage 14: Django Admin Login"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 14: Django Admin Login"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 15: Django Routes
          if [ "${{ needs.test-django-routes.result }}" == "success" ]; then
            echo "  ✅ Stage 15: Django All Routes"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ❌ Stage 15: Django All Routes"
            TOTAL_FAIL=$((TOTAL_FAIL + 1))
          fi

          # Stage 16: Static Files
          if [ "${{ needs.test-static-files.result }}" == "success" ]; then
            echo "  ✅ Stage 16: Static Files & S3"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 16: Static Files & S3 (optional)"
          fi

          # Stage 17: Ingress/ALB
          if [ "${{ needs.test-ingress-alb.result }}" == "success" ]; then
            echo "  ✅ Stage 17: Ingress & ALB"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 17: Ingress & ALB"
          fi

          # Stage 18: Network Security
          if [ "${{ needs.test-network-security.result }}" == "success" ]; then
            echo "  ✅ Stage 18: Network Security"
            TOTAL_PASS=$((TOTAL_PASS + 1))
          else
            echo "  ⚠️ Stage 18: Network Security"
          fi

          echo ""
          echo "─── Overall ───"
          echo "  📊 Passed: $TOTAL_PASS / $((TOTAL_PASS + TOTAL_FAIL))"

          if [ "$TOTAL_FAIL" -eq 0 ]; then
            echo "  🎉 ALL STAGES PASSED"
          else
            echo "  ⚠️ $TOTAL_FAIL stage(s) failed - review logs above"
          fi

          echo ""
          echo "─── Next Steps ───"
          echo "  1. Review test results above"
          echo "  2. Manually verify staging at: ${{ steps.staging-url.outputs.STAGING_URL }}"
          echo "  3. Check logs: kubectl logs -n ${{ env.HELM_NAMESPACE }} -l app=${{ env.HELM_RELEASE_NAME }}-web"
          echo "  4. If satisfied, trigger production deployment:"
          echo "     → Go to Actions → 'CD - Deploy to Production'"
          echo "     → Click 'Run workflow'"
          echo "     → Type YES in approval field"
          echo "     → Select 'staging-verified' as source"
          echo ""

      - name: Post GitHub Step Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY_EOF'
          ## 🚀 Staging Deployment Report

          | Field | Value |
          |-------|-------|
          | **Image Tag** | `${{ needs.prepare.outputs.IMAGE_TAG }}` |
          | **Trigger** | ${{ needs.prepare.outputs.TRIGGER_SOURCE }} |
          | **Source** | ${{ needs.prepare.outputs.SOURCE_REPO }} |
          | **Actor** | ${{ github.actor }} |
          | **Timestamp** | ${{ needs.prepare.outputs.DEPLOY_TIMESTAMP }} |
          | **Staging URL** | ${{ steps.staging-url.outputs.STAGING_URL }} |

          ### Stage Results

          | Stage | Status |
          |-------|--------|
          | 1. Prepare | ${{ needs.prepare.result == 'success' && '✅' || '❌' }} |
          | 2. Validate Source | ${{ needs.validate-source.result == 'success' && '✅' || '❌' }} |
          | 3. Validate Infrastructure | ${{ needs.validate-infrastructure.result == 'success' && '✅' || '❌' }} |
          | 4. Validate Helm | ${{ needs.validate-helm.result == 'success' && '✅' || '❌' }} |
          | 5. Deploy to Staging | ${{ needs.deploy-staging.result == 'success' && '✅' || '❌' }} |
          | 6. Pod Health | ${{ needs.test-pod-health.result == 'success' && '✅' || '❌' }} |
          | 7. Database | ${{ needs.test-database.result == 'success' && '✅' || '❌' }} |
          | 8. Configuration | ${{ needs.test-configuration.result == 'success' && '✅' || '❌' }} |
          | 9. Redis | ${{ needs.test-redis.result == 'success' && '✅' || '⚠️' }} |
          | 10. S3 | ${{ needs.test-s3.result == 'success' && '✅' || '⚠️' }} |
          | 11. API Endpoints | ${{ needs.test-api.result == 'success' && '✅' || '❌' }} |
          | 12. Container Security | ${{ needs.test-container-security.result == 'success' && '✅' || '⚠️' }} |
          | 13. Worker & Scheduler | ${{ needs.test-worker-scheduler.result == 'success' && '✅' || '❌' }} |
          | 14. Admin Login | ${{ needs.test-admin-login.result == 'success' && '✅' || '❌' }} |
          | 15. Django Routes | ${{ needs.test-django-routes.result == 'success' && '✅' || '❌' }} |
          | 16. Static Files | ${{ needs.test-static-files.result == 'success' && '✅' || '⚠️' }} |
          | 17. Ingress & ALB | ${{ needs.test-ingress-alb.result == 'success' && '✅' || '⚠️' }} |
          | 18. Network Security | ${{ needs.test-network-security.result == 'success' && '✅' || '⚠️' }} |
          SUMMARY_EOF

      - name: Notify status-page-app of staging results
        if: always()
        continue-on-error: true
        run: |
          # Determine overall status
          DEPLOY_RESULT="${{ needs.deploy-staging.result }}"
          POD_RESULT="${{ needs.test-pod-health.result }}"
          DB_RESULT="${{ needs.test-database.result }}"
          API_RESULT="${{ needs.test-api.result }}"
          WORKER_RESULT="${{ needs.test-worker-scheduler.result }}"
          ADMIN_RESULT="${{ needs.test-admin-login.result }}"
          ROUTES_RESULT="${{ needs.test-django-routes.result }}"
          SECURITY_RESULT="${{ needs.test-network-security.result }}"

          if [ "$DEPLOY_RESULT" == "success" ] && [ "$POD_RESULT" == "success" ] && [ "$API_RESULT" == "success" ]; then
            STATUS="success"
            TESTS_PASSED="true"
          else
            STATUS="failure"
            TESTS_PASSED="false"
          fi

          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PAT_TOKEN }}" \
            https://api.github.com/repos/Nadavvv20/status-page-app/dispatches \
            -d "{
              \"event_type\": \"staging-deployment-complete\",
              \"client_payload\": {
                \"image_tag\": \"${{ needs.prepare.outputs.IMAGE_TAG }}\",
                \"status\": \"$STATUS\",
                \"tests_passed\": $TESTS_PASSED,
                \"staging_url\": \"${{ steps.staging-url.outputs.STAGING_URL }}\",
                \"timestamp\": \"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\",
                \"actor\": \"${{ github.actor }}\",
                \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }"

          echo "✅ Notification sent to status-page-app"
